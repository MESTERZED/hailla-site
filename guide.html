<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <!--@include head-->
    <title>Guide IA — HAILLA</title>
    <meta name="description" content="Un guide touristique intelligent, disponible 24 h/24 en français, arabe et anglais : discussion, planificateur de voyage et traducteur darja." />
  </head>
  <body data-barba="wrapper">
    <!--@include header-->

    <main id="main" data-barba="container" data-barba-namespace="guide" data-lat="36.7509" data-lng="5.0567" data-place="Béjaïa">
      <div class="container page-head page-head--tight">
        <p class="mono eyebrow" data-i18n="nav.guide">Guide IA</p>
        <h1 data-i18n="guide.title">Guide IA</h1>
        <p class="lede" data-i18n="guide.lede">Un guide local qui répond à toute heure : itinéraires, adresses, horaires, transports, phrases utiles.</p>
        <div class="gtabs" role="tablist" data-i18n-aria="guide.title" aria-label="Guide IA" data-gtabs>
          <button role="tab" type="button" id="gt-chat" aria-controls="gp-chat" aria-selected="true" data-gtab="chat"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4Z"/></svg><span data-i18n="gt.chat">Discussion</span></button>
          <button role="tab" type="button" id="gt-plan" aria-controls="gp-plan" aria-selected="false" tabindex="-1" data-gtab="plan"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.8 4.2 2.8 6.2 7 7-4.2.8-6.2 2.8-7 7-.8-4.2-2.8-6.2-7-7 4.2-.8 6.2-2.8 7-7Z"/></svg><span data-i18n="gt.plan">Planifier un voyage</span></button>
          <button role="tab" type="button" id="gt-tr" aria-controls="gp-tr" aria-selected="false" tabindex="-1" data-gtab="tr"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h10M8 3v2M5.5 5c.8 3 3 5.5 6 7M10.5 5c-.8 3.5-3 6.5-6.5 8"/><path d="m12 21 4.5-10 4.5 10M13.5 17.5h6"/></svg><span data-i18n="gt.translator">Traducteur</span></button>
        </div>
      </div>

      <div class="container guide" role="tabpanel" id="gp-chat" aria-labelledby="gt-chat" data-gpanel="chat">
        <section class="guide__chat" aria-label="Conversation" data-guide-chat></section>
        <aside class="guide__side">
          <div class="pass">
            <p class="mono keep pass__tag">PASS</p>
            <h2 class="pass__title" data-i18n="guide.premium">Pass Guide IA — 1 350 DA</h2>
            <p data-i18n="guide.premium.p">Itinéraires illimités, mode hors ligne et récits audio sur tous les sites.</p>
          </div>
          <button class="side-cta" type="button" data-open-tab="plan"><span class="side-cta__ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.8 4.2 2.8 6.2 7 7-4.2.8-6.2 2.8-7 7-.8-4.2-2.8-6.2-7-7 4.2-.8 6.2-2.8 7-7Z"/></svg></span><span><strong data-i18n="gt.plan">Planifier un voyage</strong><span data-i18n="gt.planP">Un itinéraire jour par jour en 4 questions.</span></span></button>
          <button class="side-cta" type="button" data-open-tab="tr"><span class="side-cta__ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h10M8 3v2M5.5 5c.8 3 3 5.5 6 7M10.5 5c-.8 3.5-3 6.5-6.5 8"/><path d="m12 21 4.5-10 4.5 10M13.5 17.5h6"/></svg></span><span><strong data-i18n="gt.translator">Traducteur</strong><span data-i18n="gt.trP">Parlez avec un chauffeur ou un commerçant en darja.</span></span></button>
        </aside>
      </div>

      <div class="container planner-wrap" role="tabpanel" id="gp-plan" aria-labelledby="gt-plan" data-gpanel="plan" hidden>
        <div class="app-screen" data-planner></div>
      </div>

      <div class="container planner-wrap" role="tabpanel" id="gp-tr" aria-labelledby="gt-tr" data-gpanel="tr" hidden>
        <div class="app-screen app-screen--tr" data-translator></div>
      </div>
    </main>

    <!--@include footer-->
  </body>
</html>
