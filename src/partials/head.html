    <script>
      // Language & JS flags before first paint (avoids an LTR→RTL flash).
      (function () {
        var d = document.documentElement, l = 'fr';
        try { l = JSON.parse(localStorage.getItem('hailla:lang')) || 'fr'; } catch (e) {}
        if (['fr', 'en', 'ar'].indexOf(l) < 0) l = 'fr';
        d.lang = l; d.dir = l === 'ar' ? 'rtl' : 'ltr'; d.classList.add('js');
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('reduced');
      })();
    </script>
